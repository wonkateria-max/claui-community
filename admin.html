<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#070708"/>
<title>Claui Admin</title>
<link rel="stylesheet" href="admin.css?v=20261025-1"/>
<script defer src="admin.js?v=20261025-1"></script>
</head>
<body>
<main class="admin-shell">
  <section id="login-view" class="login-card">
    <p class="eyebrow">PRIVATE ACCESS</p>
    <h1>Claui Admin</h1>
    <p class="muted">Manage this week’s picks, shared votes, and community submissions.</p>
    <form id="login-form">
      <label>Email<input id="admin-email" type="email" value="wonkateria@gmail.com" autocomplete="username" readonly/></label>
      <label>Password<input id="admin-password" type="password" autocomplete="current-password" required/></label>
      <button type="submit">Sign in</button>
      <p id="login-status" class="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="./">← Back to Claui Community</a>
  </section>

  <section id="dashboard-view" class="dashboard" hidden>
    <header class="admin-topbar">
      <div><p class="eyebrow">CLAUI CONTROL ROOM</p><h1>Community Admin</h1></div>
      <div class="top-actions"><a href="./" target="_blank" rel="noreferrer">Open live site ↗</a><button id="logout-btn" class="ghost" type="button">Log out</button></div>
    </header>

    <div class="stats-grid">
      <article><span>Active poll</span><strong id="stat-poll">—</strong></article>
      <article><span>Total votes</span><strong id="stat-votes">0</strong></article>
      <article><span>New submissions</span><strong id="stat-submissions">0</strong></article>
    </div>

    <div class="admin-grid">
      <section class="panel poll-panel">
        <div class="panel-head"><div><p class="mini">THIS WEEK’S PICKS</p><h2 id="poll-title">Loading…</h2></div><button id="refresh-btn" class="ghost" type="button">Refresh</button></div>
        <form id="add-pick-form" class="add-form"><input id="new-pick-title" placeholder="Add a new game / content pick" maxlength="120" required/><button type="submit">+ Add pick</button></form>
        <div id="poll-options" class="poll-options"></div>
        <div class="poll-tools"><button id="reset-votes-btn" class="danger-lite" type="button">Reset all votes</button></div>
        <p id="poll-status" class="status" aria-live="polite"></p>
      </section>

      <section class="panel submissions-panel">
        <div class="panel-head"><div><p class="mini">COMMUNITY INBOX</p><h2>Submissions</h2></div><select id="submission-filter"><option value="all">All</option><option value="new">New</option><option value="reviewed">Reviewed</option><option value="approved">Approved</option><option value="used">Used</option><option value="archived">Archived</option></select></div>
        <div id="submissions-list" class="submissions-list"></div>
        <p id="submission-status" class="status" aria-live="polite"></p>
      </section>
    </div>
  </section>
</main>
</body>
</html>
